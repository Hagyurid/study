function brushLine(a,b){

}
function setBrushMode(on){

}

c.addEventListener('pointerup',stopPaint);c.addEventListener('pointercancel',stopPaint);

 gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,texCtl);

function queueRender(){

}
function setRenderScale(scale){
 if(!fullW||!fullH)return;
 const w=Math.max(320,Math.round(fullW*scale)),h=Math.max(240,Math.round(fullH*scale));

}
function applyValues(next){
 Object.assign(vals,next);
 for(const [k] of controls){const sl=$('s_'+k),tx=$('v_'+k);if(sl)sl.value=vals[k];if(tx)tx.textContent=vals[k].toFixed(2)}

}
function fmt(k,v,unit){
 if(unit==='EV')return (v>0?'+':'')+v.toFixed(2)+' EV';
 if(k==='hardness')return Math.round(v*100);
 if(['edgeBlend','falloff'].includes(k))return Math.round(v*100);

}
function currentControls(){
 if(activeTab==='LOOK')return groups.LOOK;
 if(activeTab==='SHAPE')return groups.SHAPE;
 if(activeTab==='TUNE')return editSub==='FLASHTONE'?groups.FLASHTONE:groups.FLASHCOLOR;

}
function buildRows(box){
 for(const [k,n,min,max,unit] of currentControls()){
  const r=document.createElement('div');r.className='row';
  r.innerHTML=`<div class="lab"><span class="name">${n}</span><button class="valBtn" id="v_${k}" title="눌러서 초기화">${fmt(k,vals[k],unit)}</button></div><input id="s_${k}" type="range" min="${min}" max="${max}" step=".01" value="${vals[k]}">`;
  const sl=r.querySelector('input'),vb=r.querySelector('.valBtn');
  sl.onpointerdown=()=>{dragging=true;setRenderScale(.45)};
  const finish=()=>{if(dragging){dragging=false;setRenderScale(1)}};sl.onpointerup=finish;sl.onpointercancel=finish;sl.onchange=finish;
  sl.oninput=()=>{vals[k]=+sl.value;vb.textContent=fmt(k,vals[k],unit);queueRender()};
  vb.onclick=()=>{vals[k]=original[k];sl.value=vals[k];vb.textContent=fmt(k,vals[k],unit);queueRender()};

}
function ui(){
 const q=$('panel');q.classList.remove('hide');q.innerHTML='';
 const head=document.createElement('div');head.className='editorHead';
 head.innerHTML=`<div><b>${activeTab==='LOOK'?'빠른 조절':activeTab==='SHAPE'?'빛 모양':activeTab==='TUNE'?'플래시 세부':'전체 보정'}</b><small>${activeTab==='LOOK'?'먼저 여기서 직광 느낌을 잡으세요':activeTab==='SHAPE'?'빛이 닿는 범위와 경계를 조절합니다':activeTab==='TUNE'?'플래시의 톤과 색만 세부 조절합니다':'사진 전체를 마무리합니다'}</small></div>`;
 q.appendChild(head);
 const tabs=document.createElement('div');tabs.className='tabs';
 const labels={LOOK:'빠른 조절',SHAPE:'빛 모양',TUNE:'플래시 세부',EDIT:'전체 보정'};
 for(const t of ['LOOK','SHAPE','TUNE','EDIT']){const b=document.createElement('button');b.className='tab '+(activeTab===t?'on':'');b.textContent=labels[t];b.onclick=()=>{activeTab=t;if(t==='TUNE'&&!['FLASHTONE','FLASHCOLOR'].includes(editSub))editSub='FLASHTONE';if(t==='EDIT'&&!['LIGHT','COLOR'].includes(editSub))editSub='LIGHT';ui()};tabs.appendChild(b)}q.appendChild(tabs);
 if(activeTab==='TUNE'){if(!['FLASHTONE','FLASHCOLOR'].includes(editSub))editSub='FLASHTONE';const sub=document.createElement('div');sub.className='subtabs';sub.innerHTML=`<button class="${editSub==='FLASHTONE'?'on':''}">톤</button><button class="${editSub==='FLASHCOLOR'?'on':''}">색감</button>`;const bs=sub.querySelectorAll('button');bs[0].onclick=()=>{editSub='FLASHTONE';ui()};bs[1].onclick=()=>{editSub='FLASHCOLOR';ui()};q.appendChild(sub)}
 if(activeTab==='EDIT'){if(!['LIGHT','COLOR'].includes(editSub))editSub='LIGHT';const sub=document.createElement('div');sub.className='subtabs';sub.innerHTML=`<button class="${editSub==='LIGHT'?'on':''}">빛</button><button class="${editSub==='COLOR'?'on':''}">색감</button>`;const bs=sub.querySelectorAll('button');bs[0].onclick=()=>{editSub='LIGHT';ui()};bs[1].onclick=()=>{editSub='COLOR';ui()};q.appendChild(sub)}
 if(activeTab==='SHAPE'){
  const tools=document.createElement('div');tools.className='maskTools';
  tools.innerHTML=`<div class="maskToolRow"><button id="maskView" class="maskBtn ${maskPreview?'on':''}">${maskPreview?'마스크 끄기':'마스크 보기'}</button><button id="brushEdit" class="maskBtn ${brushMode?'on':''}">${brushMode?'수정 완료':'마스크 수정'}</button></div>`;

   const ed=document.createElement('div');ed.className='brushEditor';
   ed.innerHTML=`<div class="brushModes"><button id="erase" class="${brushErase?'on':''}">지우기</button><button id="restoreBrush" class="${!brushErase?'on':''}">복원</button></div>

   <label>부드러움 <span>${Math.round(brushSoft*100)}</span><input id="brushSoft" type="range" min="0" max="1" step=".01" value="${brushSoft}"></label>

async function restore(){
 document.body.classList.add('editing');
 let q=await get();if(!q){document.body.classList.remove('editing');return false;}
 originalBlob=q.original||q.blob;
 const depth=new Uint8Array(q.depth),dw=q.dw,dh=q.dh;
 const sourceW=q.ow||q.w,sourceH=q.oh||q.h;

 // One-time 512px control-map preprocessing after AI has already been unloaded/reloaded.
 const maxCtl=512,cs=Math.min(1,maxCtl/Math.max(sourceW,sourceH));

 const sc=Math.min(1,Math.sqrt(maxPreviewPixels/(sourceW*sourceH)));
 const rw=Math.max(1,Math.round(sourceW*sc)),rh=Math.max(1,Math.round(sourceH*sc));
 $('status').textContent='고화질 미리보기 준비 중…';
 let bm=null;
 try{
   bm=await createImageBitmap(originalBlob,{resizeWidth:rw,resizeHeight:rh,resizeQuality:'high'});
 }catch(_e){
   const full=await createImageBitmap(originalBlob);
   let tc=document.createElement('canvas');tc.width=rw;tc.height=rh;
   tc.getContext('2d',{alpha:false}).drawImage(full,0,0,rw,rh);full.close();
   const tb=await new Promise((ok,no)=>tc.toBlob(v=>v?ok(v):no(Error('preview 생성 실패')),'image/png'));
   tc.width=tc.height=1;tc=null;bm=await createImageBitmap(tb);
 }

 const e=$('empty');if(e)e.remove();

}
async function analyze(file){

 let bm=await createImageBitmap(file),ow=bm.width,oh=bm.height;
 let ds=Math.min(1,320/Math.max(ow,oh)),iw=Math.max(80,Math.round(ow*ds)),ih=Math.max(80,Math.round(oh*ds));
 let dc=document.createElement('canvas');dc.width=iw;dc.height=ih;dc.getContext('2d',{alpha:false}).drawImage(bm,0,0,iw,ih);
 let depthURL=dc.toDataURL('image/jpeg',.84);
 // Release the full photo and both canvas backing stores BEFORE loading the model.
 bm.close();bm=null;dc.width=dc.height=1;dc=null;
 $('status').textContent='Depth 모델 준비 중…';
 let mod=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2');mod.env.allowLocalModels=false;
 let pipe=await mod.pipeline('depth-estimation','onnx-community/depth-anything-v2-small',{dtype:'q4',device:'wasm'});
 $('status').textContent='320px Depth 분석 중…';
 let input=await mod.RawImage.fromURL(depthURL);depthURL=null;
 let r=await pipe(input),dep=r.predicted_depth||r.depth;

 for(let i=0;i<raw.length;i++){let v=raw[i];if(v<min)min=v;if(v>max)max=v}
 let d=new Uint8Array(raw.length),range=max-min||1;

async function savePhoto(){

  if(raf){cancelAnimationFrame(raf);raf=0}
  const session=await get();const source=originalBlob||session?.original||session?.blob;
  if(!source)throw Error('원본 파일을 찾지 못했습니다');
  bm=await createImageBitmap(source);
  const maxExportPixels=12500000;
  const sourceW=bm.width,sourceH=bm.height;const sc=Math.min(1,Math.sqrt(maxExportPixels/(sourceW*sourceH)));
  const ew=Math.max(1,Math.round(sourceW*sc)),eh=Math.max(1,Math.round(sourceH*sc));
  c.width=ew;c.height=eh;
  exportTex=texture(0,ew,eh,bm);texImg=exportTex;
  render();
  const blob=await new Promise((ok,no)=>c.toBlob(v=>v?ok(v):no(Error('JPEG 저장 실패')),'image/jpeg',.98));
  const name='FlashLook-'+new Date().toISOString().replace(/[:.]/g,'-')+'.jpg';
  const file=new File([blob],name,{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
   try{
    await navigator.share({files:[file],title:'FlashLook'});
    $('status').textContent=`고화질 결과 ${ew}×${eh}px 생성 완료`+(sc<1?` · 원본 ${sourceW}×${sourceH}px에서 12.5MP 안전 제한 적용`:' · 원본 픽셀 크기 유지');
    return;
   }catch(e){if(e&&e.name==='AbortError')return}
  }
  const url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  $('status').textContent=`JPEG ${ew}×${eh}px 저장 시작`+(sc<1?` · 원본 ${sourceW}×${sourceH}px`:' · 원본 픽셀 크기 유지');
 }catch(e){
  console.error(e);$('status').textContent='저장 실패: '+e.message;

 }
}
