 const depth=new Uint8Array(q.depth),dw=q.dw,dh=q.dh;
 const sourceW=q.ow||q.w,sourceH=q.oh||q.h;

 // One-time 512px control-map preprocessing after AI has already been unloaded/reloaded.
 const maxCtl=512,cs=Math.min(1,maxCtl/Math.max(sourceW,sourceH));
 controlW=Math.max(96,Math.round(sourceW*cs));controlH=Math.max(96,Math.round(sourceH*cs));
 $('status').textContent='경계 보호용 Control Map 준비 중…';
 let edgeBm=await createImageBitmap(originalBlob,{resizeWidth:controlW,resizeHeight:controlH,resizeQuality:'high'});
 let ec=document.createElement('canvas');ec.width=controlW;ec.height=controlH;
 let ex=ec.getContext('2d',{alpha:false,willReadFrequently:true});ex.drawImage(edgeBm,0,0,controlW,controlH);edgeBm.close();
 let rgb=ex.getImageData(0,0,controlW,controlH).data;
 let ctl=makeControlMap(rgb,controlW,controlH,depth,dw,dh);
 ec.width=ec.height=1;ec=null;rgb=null;
 controlData=ctl;autoControlData=new Uint8Array(ctl);userMask=new Float32Array(controlW*controlH);userMask.fill(1);
 if(edit?.settings||q.settings)Object.assign(vals,edit?.settings||q.settings);if(edit?.skinRef)skinRef=edit.skinRef;if(edit?.localMode)localMode=edit.localMode;
 const savedMask=edit?.userMask||q.userMask;if(savedMask){
  const saved=new Float32Array(savedMask);
  if(saved.length===userMask.length){userMask.set(saved);rebuildSoftMask()}
 }
 texCtl=controlTexture(controlW,controlH,controlData);
 localW=controlW;localH=controlH;localData=new Uint8Array(localW*localH*4);
 for(let i=0;i<localW*localH;i++){localData[i*4]=128;localData[i*4+1]=0;localData[i*4+2]=0;localData[i*4+3]=255}
 const savedLocal=edit?.localData||q.localData;if(savedLocal){const ld=new Uint8Array(savedLocal);if(ld.length===localData.length)localData.set(ld)}
 texLocal=rgbaTexture(2,localW,localH,localData);

 // High-quality edit preview is created only after control-map preprocessing.
 const maxPreviewPixels=4000000;
 const sc=Math.min(1,Math.sqrt(maxPreviewPixels/(sourceW*sourceH)));
 const rw=Math.max(1,Math.round(sourceW*sc)),rh=Math.max(1,Math.round(sourceH*sc));
 $('status').textContent='고화질 미리보기 준비 중…';
 let bm=null;
 try{
   bm=await createImageBitmap(originalBlob,{resizeWidth:rw,resizeHeight:rh,resizeQuality:'high'});
 }catch(_e){
   const full=await createImageBitmap(originalBlob);
   let tc=document.createElement('canvas');tc.width=rw;tc.height=rh;
   tc.getContext('2d',{alpha:false}).drawImage(full,0,0,rw,rh);full.close();
   const tb=await new Promise((ok,no)=>tc.toBlob(v=>v?ok(v):no(Error('preview 생성 실패')),'image/png'));
   tc.width=tc.height=1;tc=null;bm=await createImageBitmap(tb);
 }
 fullW=rw;fullH=rh;c.width=fullW;c.height=fullH;
 const e=$('empty');if(e)e.remove();
 texImg=texture(0,rw,rh,bm);bm.close();
 $('save').hidden=false;$('compare').hidden=false;$('pick').textContent='다른 사진 선택';
 $('status').textContent=`편집 ${rw}×${rh}px · 사진을 보면서 아래 슬라이더를 조절하세요`;
 ui();render();return true;
}
async function analyze(file){
 $('status').textContent='사진을 작게 준비하는 중…';
 let bm=await createImageBitmap(file),ow=bm.width,oh=bm.height;
 let ds=Math.min(1,320/Math.max(ow,oh)),iw=Math.max(80,Math.round(ow*ds)),ih=Math.max(80,Math.round(oh*ds));
 let dc=document.createElement('canvas');dc.width=iw;dc.height=ih;dc.getContext('2d',{alpha:false}).drawImage(bm,0,0,iw,ih);
 let depthURL=dc.toDataURL('image/jpeg',.84);
 // Release the full photo and both canvas backing stores BEFORE loading the model.
 bm.close();bm=null;dc.width=dc.height=1;dc=null;
 $('status').textContent='Depth 모델 준비 중…';
 let mod=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2');mod.env.allowLocalModels=false;
 let pipe=await mod.pipeline('depth-estimation','onnx-community/depth-anything-v2-small',{dtype:'q4',device:'wasm'});
 $('status').textContent='320px Depth 분석 중…';
 let input=await mod.RawImage.fromURL(depthURL);depthURL=null;
 let r=await pipe(input),dep=r.predicted_depth||r.depth;
 if(!dep||!dep.data)throw Error('Depth output 없음');
 let raw=dep.data,dims=dep.dims||[],dw=dims[dims.length-1]||iw,dh=dims[dims.length-2]||ih,min=Infinity,max=-Infinity;
 for(let i=0;i<raw.length;i++){let v=raw[i];if(v<min)min=v;if(v>max)max=v}
 let d=new Uint8Array(raw.length),range=max-min||1;
 for(let i=0;i<raw.length;i++)d[i]=Math.max(0,Math.min(255,Math.round((raw[i]-min)/range*255)));
 dep=null;r=null;input=null;raw=null;
 try{await pipe.dispose?.()}catch(_e){} pipe=null;mod=null;
 $('status').textContent='Depth 완료 · 편집 화면으로 전환 중…';
 await put({original:file,ow,oh,dw,dh,depth:d.buffer});await clearEdit();
 location.replace(location.pathname+'?edit=1&v=65');
}
async function savePhoto(){
 const btn=$('save'),old=btn.textContent,oldTex=texImg,oldW=c.width,oldH=c.height;
 let exportTex=null,bm=null;
 try{
  btn.disabled=true;btn.textContent='고화질 사진 만드는 중…';
  if(raf){cancelAnimationFrame(raf);raf=0}
  const session=await get();const source=originalBlob||session?.original||session?.blob;
  if(!source)throw Error('원본 파일을 찾지 못했습니다');
  bm=await createImageBitmap(source);
  const maxExportPixels=12500000;
  const sourceW=bm.width,sourceH=bm.height;const sc=Math.min(1,Math.sqrt(maxExportPixels/(sourceW*sourceH)));
  const ew=Math.max(1,Math.round(sourceW*sc)),eh=Math.max(1,Math.round(sourceH*sc));
  c.width=ew;c.height=eh;
  exportTex=texture(0,ew,eh,bm);texImg=exportTex;
  render();
  const blob=await new Promise((ok,no)=>c.toBlob(v=>v?ok(v):no(Error('JPEG 저장 실패')),'image/jpeg',.98));
  const name='FlashLook-'+new Date().toISOString().replace(/[:.]/g,'-')+'.jpg';
  const file=new File([blob],name,{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
   try{
    await navigator.share({files:[file],title:'FlashLook'});
    $('status').textContent=`고화질 결과 ${ew}×${eh}px 생성 완료`+(sc<1?` · 원본 ${sourceW}×${sourceH}px에서 12.5MP 안전 제한 적용`:' · 원본 픽셀 크기 유지');
    return;
   }catch(e){if(e&&e.name==='AbortError')return}
  }
  const url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  $('status').textContent=`JPEG ${ew}×${eh}px 저장 시작`+(sc<1?` · 원본 ${sourceW}×${sourceH}px`:' · 원본 픽셀 크기 유지');
 }catch(e){
  console.error(e);$('status').textContent='저장 실패: '+e.message;
 }finally{
  if(bm)bm.close();
  if(exportTex)gl.deleteTexture(exportTex);
  texImg=oldTex;c.width=oldW;c.height=oldH;render();
  btn.disabled=false;btn.textContent=old;
 }
}
$('save').onclick=savePhoto;
const cmp=$('compare');
const showBefore=()=>{beforeHeld=true;queueRender()},showAfter=()=>{beforeHeld=false;queueRender()};
cmp.onpointerdown=e=>{e.preventDefault();showBefore()};cmp.onpointerup=showAfter;cmp.onpointercancel=showAfter;cmp.onpointerleave=showAfter;
$('pick').onclick=()=>$('file').click();$('file').onchange=async e=>{try{await analyze(e.target.files[0])}catch(err){$('status').textContent='분석 실패: '+err.message;console.error(err)}};
if(new URLSearchParams(location.search).get('edit')==='1')restore();
