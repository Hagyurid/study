<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FLASH LOOK V2</title><style>
:root{--bg:#f2efe8;--panel:#fbf9f4;--ink:#292725;--muted:#77716a;--line:#d9d3c9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.app{min-height:100vh}header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#f2efe8ee;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}b{letter-spacing:.1em}.sub,.hint{font-size:12px;color:var(--muted);line-height:1.5}.shell{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px}.stage{min-height:60vh;background:#d9d4cc;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}canvas{display:block;max-width:100%;max-height:calc(100vh - 100px);touch-action:none}.empty{position:absolute;text-align:center;padding:24px}.empty strong{display:block;margin-bottom:8px}.target{position:absolute;width:30px;height:30px;border:2px solid white;border-radius:50%;box-shadow:0 0 0 1px #0008;transform:translate(-50%,-50%);display:none;pointer-events:none}aside{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px}.sec{padding:0 0 15px;margin:0 0 15px;border-bottom:1px solid var(--line)}h2{font-size:14px;margin:0 0 10px}.row,.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}button,.file{border:1px solid var(--line);background:white;border-radius:11px;padding:10px 12px;font-weight:700;text-align:center;min-height:42px}button.active,button.primary{background:#292725;color:white}button:disabled{opacity:.4}.file{display:block}input[type=file]{display:none}.ctl{margin:12px 0}.lr{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.val{color:var(--muted)}input[type=range]{width:100%;accent-color:#292725}.advanced{display:none}.advanced.open{display:block}@media(max-width:850px){.shell{grid-template-columns:1fr;padding:9px}.stage{min-height:56vh}canvas{max-height:70vh}}
</style></head><body><div class="app"><header><div><b>FLASH LOOK V2</b><div class="sub">AI-free direct flash relighting · V2.1</div></div><button id="save" class="primary" disabled>저장</button></header>
<main class="shell"><section class="stage" id="stage"><canvas id="c"></canvas><div id="target" class="target"></div><div id="empty" class="empty"><strong>사진을 불러와</strong><div class="hint">사진을 연 뒤 주 피사체를 한 번 눌러줘.</div><br><label class="file" for="file">사진 선택</label></div></section>
<aside><div class="sec"><h2>사진</h2><label class="file" for="file">사진 불러오기</label><input id="file" type="file" accept="image/*"><div class="hint">서버 업로드 없이 브라우저에서 처리됨.</div></div>
<div class="sec"><h2>주 피사체</h2><div class="hint">사진을 넣으면 즉시 전체에 직광 보정이 적용됨. 사람/물체를 누르면 그 피사체 쪽에 플래시가 더 집중됨.</div><div class="ctl"><div class="lr"><span>선택 범위</span><span id="tolV" class="val"></span></div><input id="tol" type="range" min="8" max="70" value="34"></div></div>
<div class="sec"><h2>플래시</h2><div class="ctl"><div class="lr"><span>Flash power</span><span id="flashV" class="val"></span></div><input id="flash" type="range" min="0" max="240" value="165"></div><div class="ctl"><div class="lr"><span>Ambient</span><span id="ambientV" class="val"></span></div><input id="ambient" type="range" min="-160" max="40" value="-75"></div><div class="ctl"><div class="lr"><span>Background</span><span id="bgV" class="val"></span></div><input id="bg" type="range" min="-120" max="30" value="-55"></div><div class="ctl"><div class="lr"><span>Highlight clip</span><span id="specV" class="val"></span></div><input id="spec" type="range" min="0" max="100" value="62"></div></div>
<div class="sec"><h2>프리셋</h2><div class="presets"><button data-p="compact">디카 직광</button><button data-p="party">밤 파티</button><button data-p="phone">폰 플래시</button><button data-p="soft">소프트</button></div></div>
<div class="sec"><button id="advBtn" style="width:100%">Advanced</button><div id="advanced" class="advanced"><div class="ctl"><div class="lr"><span>Local contrast</span><span id="clarityV" class="val"></span></div><input id="clarity" type="range" min="0" max="100" value="26"></div><div class="ctl"><div class="lr"><span>색온도</span><span id="tempV" class="val"></span></div><input id="temp" type="range" min="-50" max="50" value="-8"></div><div class="ctl"><div class="lr"><span>채도</span><span id="satV" class="val"></span></div><input id="sat" type="range" min="-40" max="40" value="-7"></div><div class="ctl"><div class="lr"><span>Grain</span><span id="grainV" class="val"></span></div><input id="grain" type="range" min="0" max="60" value="8"></div></div></div>
<div class="row"><button id="before" disabled>원본</button><button id="after" class="active" disabled>보정</button></div></aside></main></div>
<script>
(()=>{const c=document.querySelector('#c'),x=c.getContext('2d',{willReadFrequently:true}),file=document.querySelector('#file'),empty=document.querySelector('#empty'),stage=document.querySelector('#stage'),target=document.querySelector('#target'),save=document.querySelector('#save'),before=document.querySelector('#before'),after=document.querySelector('#after');
const ids=['tol','flash','ambient','bg','spec','clarity','temp','sat','grain'],E=Object.fromEntries(ids.map(k=>[k,document.querySelector('#'+k)]));let src=null,mask=null,px=.5,py=.45,name='flash-look-v2',orig=false,timer;
const presets={compact:{flash:150,ambient:-62,bg:-42,spec:55,clarity:32,temp:-10,sat:-10,grain:11},party:{flash:175,ambient:-90,bg:-70,spec:66,clarity:38,temp:-4,sat:3,grain:15},phone:{flash:125,ambient:-40,bg:-25,spec:42,clarity:20,temp:-15,sat:-5,grain:5},soft:{flash:90,ambient:-25,bg:-12,spec:25,clarity:10,temp:3,sat:-3,grain:3}};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lin=v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)},srgb=v=>{v=clamp(v);return 255*(v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055)},lum=(r,g,b)=>.2126*r+.7152*g+.0722*b;
function vals(){document.querySelector('#tolV').textContent=E.tol.value;document.querySelector('#flashV').textContent=(E.flash.value/100).toFixed(2)+' EV';document.querySelector('#ambientV').textContent=(E.ambient.value/100).toFixed(2)+' EV';document.querySelector('#bgV').textContent=(E.bg.value/100).toFixed(2)+' EV';document.querySelector('#specV').textContent=E.spec.value+'%';document.querySelector('#clarityV').textContent=E.clarity.value+'%';document.querySelector('#tempV').textContent=E.temp.value;document.querySelector('#satV').textContent=E.sat.value;document.querySelector('#grainV').textContent=E.grain.value+'%'}
function blur1(a,w,h){let o=new Float32Array(a.length),r=3;for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){let s=0,n=0;for(let k=-r;k<=r;k++){let q=xx+k;if(q>=0&&q<w){s+=a[y*w+q];n++}}o[y*w+xx]=s/n}let z=new Float32Array(a.length);for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){let s=0,n=0;for(let k=-r;k<=r;k++){let q=y+k;if(q>=0&&q<h){s+=o[q*w+xx];n++}}z[y*w+xx]=s/n}return z}
function buildMask(){if(!src)return;const w=c.width,h=c.height,scale=Math.max(1,Math.ceil(Math.max(w,h)/420)),sw=Math.ceil(w/scale),sh=Math.ceil(h/scale),d=src.data,seedX=Math.min(sw-1,Math.floor(px*w/scale)),seedY=Math.min(sh-1,Math.floor(py*h/scale)),si=((seedY*scale)*w+seedX*scale)*4,sr=d[si],sg=d[si+1],sb=d[si+2],sl=lum(sr,sg,sb),tol=+E.tol.value,qx=new Int32Array(sw*sh),qy=new Int32Array(sw*sh),vis=new Uint8Array(sw*sh),sm=new Float32Array(sw*sh);let head=0,tail=0;qx[tail]=seedX;qy[tail++]=seedY;vis[seedY*sw+seedX]=1;const maxD=Math.hypot(sw,sh)*.52;
while(head<tail){let xx=qx[head],yy=qy[head++],ii=((Math.min(h-1,yy*scale))*w+Math.min(w-1,xx*scale))*4,r=d[ii],g=d[ii+1],b=d[ii+2],dl=Math.abs(lum(r,g,b)-sl),dc=Math.sqrt((r-sr)**2+(g-sg)**2+(b-sb)**2)/1.73,dist=Math.hypot(xx-seedX,yy-seedY);if(dc>tol*2.15||dl>tol*2.6||dist>maxD)continue;sm[yy*sw+xx]=1;for(const [ax,ay] of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=xx+ax,ny=yy+ay,j=ny*sw+nx;if(nx>=0&&nx<sw&&ny>=0&&ny<sh&&!vis[j]){vis[j]=1;qx[tail]=nx;qy[tail++]=ny}}}
sm=blur1(blur1(sm,sw,sh),sw,sh);mask=new Float32Array(w*h);for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){let sx=Math.min(sw-1,Math.floor(xx/scale)),sy=Math.min(sh-1,Math.floor(y/scale));mask[y*w+xx]=clamp(sm[sy*sw+sx]*1.35)}}
function render(){if(!src)return;if(orig){x.putImageData(src,0,0);return}if(!mask)buildMask();const w=c.width,h=c.height,d=src.data,out=new ImageData(new Uint8ClampedArray(d),w,h),o=out.data,P=Object.fromEntries(ids.map(k=>[k,+E[k].value]));const aMul=Math.pow(2,P.ambient/100),fMul=Math.pow(2,P.flash/100)-1,bMul=Math.pow(2,P.bg/100),sat=1+P.sat/100,temp=P.temp/50,spec=P.spec/100,clar=P.clarity/100,grain=P.grain/100;
let L=new Float32Array(w*h);for(let i=0,j=0;i<d.length;i+=4,j++)L[j]=lum(d[i],d[i+1],d[i+2])/255;let B=blur1(L,w,h);
for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){let j=y*w+xx,i=j*4,m=mask[j],R=lin(d[i]),G=lin(d[i+1]),Bl=lin(d[i+2]);let subject=0.30+0.70*m; let amb=aMul*(bMul+(1-bMul)*m); let flash=fMul*subject*(.52+.48*Math.pow(1-L[j],.55)); R=R*(amb+flash);G=G*(amb+flash);Bl=Bl*(amb+flash);let detail=(L[j]-B[j])*clar*(0.35+0.65*m)*1.8,Rd=srgb(R)+detail*255,Gd=srgb(G)+detail*255,Bd=srgb(Bl)+detail*255;let hmask=Math.pow(clamp((L[j]-.48)/.52),1.7)*(0.30+0.70*m)*spec,white=255*hmask*.72;Rd=Rd+(255-Rd)*hmask*.78;Gd=Gd+(255-Gd)*hmask*.78;Bd=Bd+(255-Bd)*hmask*.78;Rd+=temp*13;Gd+=temp*1.5;Bd-=temp*13;let gy=.2126*Rd+.7152*Gd+.0722*Bd;Rd=gy+(Rd-gy)*sat;Gd=gy+(Gd-gy)*sat;Bd=gy+(Bd-gy)*sat;if(grain){let n=Math.sin(xx*12.9898+y*78.233)*43758.5453;n=(n-Math.floor(n)-.5)*20*grain;Rd+=n;Gd+=n;Bd+=n}o[i]=Math.max(0,Math.min(255,Rd));o[i+1]=Math.max(0,Math.min(255,Gd));o[i+2]=Math.max(0,Math.min(255,Bd));o[i+3]=d[i+3]}x.putImageData(out,0,0)}
function queue(reMask=false){vals();if(reMask)mask=null;clearTimeout(timer);timer=setTimeout(render,25)}
function dot(){let r=c.getBoundingClientRect(),s=stage.getBoundingClientRect();target.style.left=(r.left-s.left+px*r.width)+'px';target.style.top=(r.top-s.top+py*r.height)+'px'}
file.onchange=e=>{let f=e.target.files[0];if(!f)return;name=f.name.replace(/\.[^.]+$/,'');let u=URL.createObjectURL(f),im=new Image;im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight,mp=5e6;if(w*h>mp){let s=Math.sqrt(mp/(w*h));w=Math.round(w*s);h=Math.round(h*s)}c.width=w;c.height=h;x.drawImage(im,0,0,w,h);src=x.getImageData(0,0,w,h);URL.revokeObjectURL(u);empty.style.display='none';target.style.display='block';[save,before,after].forEach(b=>b.disabled=false);mask=null;dot();render()};im.src=u};
c.onpointerdown=e=>{if(!src)return;let r=c.getBoundingClientRect();px=clamp((e.clientX-r.left)/r.width);py=clamp((e.clientY-r.top)/r.height);orig=false;before.classList.remove('active');after.classList.add('active');dot();queue(true)};
ids.forEach(k=>E[k].oninput=()=>queue(k==='tol'));document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{Object.entries(presets[b.dataset.p]).forEach(([k,v])=>E[k].value=v);orig=false;queue(false)});
before.onclick=()=>{orig=true;before.classList.add('active');after.classList.remove('active');render()};after.onclick=()=>{orig=false;after.classList.add('active');before.classList.remove('active');render()};document.querySelector('#advBtn').onclick=()=>document.querySelector('#advanced').classList.toggle('open');window.onresize=dot;
save.onclick=()=>{orig=false;render();c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'-flash-v2.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/jpeg',.95)};vals()})();
</script></body></html>
