<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FLASH LOOK V3</title>
<style>:root{--bg:#f1eee7;--panel:#fbf9f4;--ink:#292725;--muted:#77716a;--line:#d7d1c8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}header{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#f1eee7ed;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.12em}.sub,.hint{font-size:12px;color:var(--muted);line-height:1.5}.shell{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px}.stage{min-height:60vh;border:1px solid var(--line);border-radius:16px;background:#d8d3cb;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}canvas{max-width:100%;max-height:calc(100vh - 100px);display:block}.empty{position:absolute;text-align:center;padding:25px}.empty strong{display:block;margin-bottom:8px}aside{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px}.sec{padding-bottom:15px;margin-bottom:15px;border-bottom:1px solid var(--line)}h2{font-size:14px;margin:0 0 10px}.file,button{display:block;width:100%;border:1px solid var(--line);background:white;border-radius:11px;padding:10px 12px;font-weight:700;text-align:center;min-height:42px}button.primary{background:var(--ink);color:#fff}button:disabled{opacity:.4}input[type=file]{display:none}.ctl{margin:13px 0}.lr{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.val{color:var(--muted);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--ink)}.presets,.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}.advanced{display:none}.advanced.open{display:block}.badge{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:5px 8px;color:var(--muted)}@media(max-width:850px){.shell{grid-template-columns:1fr;padding:9px}.stage{min-height:56vh}canvas{max-height:70vh}}</style></head>
<body><header><div><div class="brand">FLASH LOOK</div><div class="sub">Direct-flash camera simulation · V3</div></div><span class="badge">NO AI</span></header><main class="shell"><section class="stage"><canvas id="c"></canvas><div id="empty" class="empty"><strong>사진을 불러와</strong><div class="hint">영역 선택 없이 사진 전체의 표면 반응을 계산함.</div><br><label class="file" for="file">사진 선택</label></div></section><aside>
<div class="sec"><label class="file" for="file">사진 불러오기</label><input id="file" type="file" accept="image/*"><div class="hint" style="margin-top:8px">사진은 서버로 전송되지 않음.</div></div>
<div class="sec"><h2>FLASH</h2>
<div class="ctl"><div class="lr"><span>Flash power</span><span id="flashV" class="val"></span></div><input id="flash" type="range" min="0" max="180" value="82"></div>
<div class="ctl"><div class="lr"><span>Ambient</span><span id="ambientV" class="val"></span></div><input id="ambient" type="range" min="-160" max="30" value="-52"></div>
<div class="ctl"><div class="lr"><span>Flash character</span><span id="hardV" class="val"></span></div><input id="hard" type="range" min="0" max="100" value="68"><div class="hint">SOFT ←────────→ HARD</div></div></div>
<div class="sec"><h2>LOOK</h2><div class="presets"><button data-p="digicam">2000s 디카</button><button data-p="party">파티 직광</button><button data-p="clean">클린 직광</button><button data-p="cold">차가운 직광</button></div></div>
<div class="sec"><button id="adv">Advanced</button><div id="advanced" class="advanced">
<div class="ctl"><div class="lr"><span>Specular</span><span id="specV" class="val"></span></div><input id="spec" type="range" min="0" max="100" value="62"></div>
<div class="ctl"><div class="lr"><span>Highlight clip</span><span id="clipV" class="val"></span></div><input id="clip" type="range" min="0" max="100" value="44"></div>
<div class="ctl"><div class="lr"><span>Background suppression</span><span id="bgV" class="val"></span></div><input id="bg" type="range" min="0" max="100" value="28"></div>
<div class="ctl"><div class="lr"><span>WB</span><span id="tempV" class="val"></span></div><input id="temp" type="range" min="-50" max="50" value="-7"></div>
<div class="ctl"><div class="lr"><span>Saturation</span><span id="satV" class="val"></span></div><input id="sat" type="range" min="-40" max="40" value="-7"></div>
<div class="ctl"><div class="lr"><span>Grain</span><span id="grainV" class="val"></span></div><input id="grain" type="range" min="0" max="50" value="7"></div></div></div>
<div class="compare"><button id="before" disabled>누르고 원본</button><button id="save" class="primary" disabled>저장</button></div></aside></main>
<script>(()=>{const c=document.querySelector('#c'),ctx=c.getContext('2d',{willReadFrequently:true}),file=document.querySelector('#file'),empty=document.querySelector('#empty'),save=document.querySelector('#save'),before=document.querySelector('#before');const ids=['flash','ambient','hard','spec','clip','bg','temp','sat','grain'],E=Object.fromEntries(ids.map(k=>[k,document.querySelector('#'+k)]));let src=null,name='flash-look',timer;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lin=v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)},enc=v=>{v=clamp(v);return 255*(v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055)},Y=(r,g,b)=>.2126*r+.7152*g+.0722*b;
function blur(a,w,h,r){let t=new Float32Array(a.length),o=new Float32Array(a.length);for(let y=0;y<h;y++){let s=0,n=0;for(let x=-r;x<=r;x++)if(x>=0&&x<w){s+=a[y*w+x];n++}for(let x=0;x<w;x++){t[y*w+x]=s/n;let rem=x-r,add=x+r+1;if(rem>=0){s-=a[y*w+rem];n--}if(add<w){s+=a[y*w+add];n++}}}for(let x=0;x<w;x++){let s=0,n=0;for(let y=-r;y<=r;y++)if(y>=0&&y<h){s+=t[y*w+x];n++}for(let y=0;y<h;y++){o[y*w+x]=s/n;let rem=y-r,add=y+r+1;if(rem>=0){s-=t[rem*w+x];n--}if(add<h){s+=t[add*w+x];n++}}}return o}
function values(){ids.forEach(k=>{let v=+E[k].value,txt=v; if(k==='flash'||k==='ambient')txt=(v/100).toFixed(2)+' EV';else if(k==='temp'||k==='sat')txt=(v>0?'+':'')+v;else txt=v+'%';document.querySelector('#'+k+'V').textContent=txt})}
function render(){if(!src)return;const w=c.width,h=c.height,d=src.data,o=new ImageData(new Uint8ClampedArray(d),w,h),z=o.data,p=Object.fromEntries(ids.map(k=>[k,+E[k].value]));let l=new Float32Array(w*h);for(let j=0,i=0;j<l.length;j++,i+=4)l[j]=Y(d[i],d[i+1],d[i+2])/255;let broad=blur(l,w,h,Math.max(2,Math.round(Math.min(w,h)/90))),fine=blur(l,w,h,2);const amb=Math.pow(2,p.ambient/100),fp=Math.pow(2,p.flash/100)-1,hard=p.hard/100,spec=p.spec/100,clip=p.clip/100,bg=p.bg/100,sat=1+p.sat/100,temp=p.temp/50;
for(let y=0;y<h;y++)for(let x=0;x<w;x++){let j=y*w+x,i=j*4,L=l[j],local=L-broad[j],micro=L-fine[j];/* ambient tone: shadows/blacks suppressed more than highlights */let tone=amb*(.72+.28*Math.pow(L,.55));tone*=1-bg*(1-L)*.52;/* flash surface response: preserve chroma; shadows get fill but no white overlay */let reflect=.34+.66*Math.pow(1-L,.38);let F=fp*reflect;let R=lin(d[i])*(tone+F),G=lin(d[i+1])*(tone+F),B=lin(d[i+2])*(tone+F);let r=enc(R),g=enc(G),b=enc(B);/* hard-light local contrast */let detail=(local*.72+micro*.95)*255*hard*(.55+.45*F);r+=detail;g+=detail;b+=detail;/* specular candidate from bright local peaks, separate from diffuse */let peak=clamp((L-broad[j]*.78-.08)*4.2)*clamp((L-.38)*2.0);let sp=Math.pow(peak,1.25)*spec*(.5+.5*hard);let target=238+17*clip;r+=Math.max(0,target-r)*sp;g+=Math.max(0,target-g)*sp;b+=Math.max(0,target-b)*sp;/* flash highlights lose some chroma */let gray=Y(r,g,b),desat=sp*.38;r=gray+(r-gray)*(1-desat);g=gray+(g-gray)*(1-desat);b=gray+(b-gray)*(1-desat);/* WB + saturation */r+=temp*13;g+=temp*1.5;b-=temp*13;gray=Y(r,g,b);r=gray+(r-gray)*sat;g=gray+(g-gray)*sat;b=gray+(b-gray)*sat;if(p.grain){let n=Math.sin(x*12.9898+y*78.233)*43758.5453;n=(n-Math.floor(n)-.5)*18*(p.grain/100);r+=n;g+=n;b+=n}z[i]=Math.max(0,Math.min(255,r));z[i+1]=Math.max(0,Math.min(255,g));z[i+2]=Math.max(0,Math.min(255,b));z[i+3]=d[i+3]}ctx.putImageData(o,0,0)}
function queue(){values();clearTimeout(timer);timer=setTimeout(render,20)}ids.forEach(k=>E[k].oninput=queue);
const presets={digicam:{flash:88,ambient:-58,hard:72,spec:67,clip:53,bg:32,temp:-8,sat:-10,grain:10},party:{flash:112,ambient:-90,hard:82,spec:78,clip:68,bg:55,temp:-3,sat:2,grain:14},clean:{flash:66,ambient:-35,hard:50,spec:45,clip:28,bg:16,temp:2,sat:-2,grain:2},cold:{flash:94,ambient:-65,hard:74,spec:70,clip:55,bg:36,temp:-24,sat:-9,grain:7}};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{Object.entries(presets[b.dataset.p]).forEach(([k,v])=>E[k].value=v);queue()});
file.onchange=e=>{let f=e.target.files[0];if(!f)return;name=f.name.replace(/\.[^.]+$/,'');let u=URL.createObjectURL(f),im=new Image;im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight,max=5e6;if(w*h>max){let s=Math.sqrt(max/w/h);w=Math.round(w*s);h=Math.round(h*s)}c.width=w;c.height=h;ctx.drawImage(im,0,0,w,h);src=ctx.getImageData(0,0,w,h);URL.revokeObjectURL(u);empty.style.display='none';save.disabled=before.disabled=false;render()};im.src=u};before.onpointerdown=()=>src&&ctx.putImageData(src,0,0);before.onpointerup=before.onpointercancel=before.onpointerleave=render;document.querySelector('#adv').onclick=()=>document.querySelector('#advanced').classList.toggle('open');save.onclick=()=>{render();c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'-flash-v3.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/jpeg',.95)};values()})();</script></body></html>
