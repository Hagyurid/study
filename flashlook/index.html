<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FLASH LOOK V4.2</title>
<style>
:root{--bg:#f2efe8;--card:#fbfaf6;--ink:#282624;--muted:#756f68;--line:#d7d1c8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;letter-spacing:.12em}.sub,.hint,#status{font-size:12px;color:var(--muted);line-height:1.5}.badge{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:5px 8px}.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px}.stage{min-height:62vh;background:#d8d3cb;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}canvas{max-width:100%;max-height:calc(100vh - 100px);display:block}.empty{position:absolute;text-align:center;padding:24px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}.sec{padding-bottom:15px;margin-bottom:15px;border-bottom:1px solid var(--line)}h2{font-size:14px;margin:0 0 10px}.file,button{display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-weight:700;text-align:center;min-height:42px}button.primary{background:var(--ink);color:#fff}button:disabled{opacity:.42}input[type=file]{display:none}.ctl{margin:13px 0}.row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.val{color:var(--muted);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--ink)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.adv{display:none}.adv.open{display:block}.progress{height:5px;background:#e1ddd6;border-radius:9px;overflow:hidden;margin-top:8px}.progress>i{display:block;height:100%;width:0;background:#3b3936;transition:width .2s}@media(max-width:850px){.app{grid-template-columns:1fr;padding:9px}.stage{min-height:55vh}canvas{max-height:68vh}}
</style></head>
<body><header><div><div class="brand">FLASH LOOK</div><div class="sub">Local depth relighting · V4.2</div></div><span class="badge">NO API</span></header>
<main class="app"><section class="stage"><canvas id="c"></canvas><div id="empty" class="empty"><b>사진을 불러와</b><div class="hint" style="margin:8px 0 14px">기기 안에서 depth를 추정한 뒤 카메라 직광을 계산함.</div><label class="file" for="file">사진 선택</label></div></section>
<aside class="card"><div class="sec"><label class="file" for="file">사진 불러오기</label><input id="file" type="file" accept="image/*"><div id="status" style="margin-top:8px">첫 사진 분석 시 depth 모델을 다운로드함.</div><div class="progress"><i id="bar"></i></div></div>
<div class="sec"><h2>FLASH</h2>
<div class="ctl"><div class="row"><span>Flash power</span><span id="flashV" class="val"></span></div><input id="flash" type="range" min="0" max="180" value="100"></div>
<div class="ctl"><div class="row"><span>Ambient</span><span id="ambientV" class="val"></span></div><input id="ambient" type="range" min="-160" max="20" value="-65"></div>
<div class="ctl"><div class="row"><span>Hardness</span><span id="hardV" class="val"></span></div><input id="hard" type="range" min="0" max="100" value="72"></div></div>
<div class="sec"><div class="grid"><button id="depthView" disabled>Depth 보기</button><button id="reanalyze" disabled>Depth 재분석</button></div></div>
<div class="sec"><button id="advBtn">Advanced</button><div id="adv" class="adv">
<div class="ctl"><div class="row"><span>Depth strength</span><span id="depthStrengthV" class="val"></span></div><input id="depthStrength" type="range" min="0" max="100" value="72"></div>
<div class="ctl"><div class="row"><span>Specular</span><span id="specV" class="val"></span></div><input id="spec" type="range" min="0" max="100" value="62"></div>
<div class="ctl"><div class="row"><span>Background</span><span id="bgV" class="val"></span></div><input id="bg" type="range" min="0" max="100" value="38"></div>
<div class="ctl"><div class="row"><span>WB</span><span id="tempV" class="val"></span></div><input id="temp" type="range" min="-50" max="50" value="-7"></div>
<div class="ctl"><div class="row"><span>Saturation</span><span id="satV" class="val"></span></div><input id="sat" type="range" min="-40" max="40" value="-6"></div></div></div>
<div class="grid"><button id="before" disabled>누르고 원본</button><button id="save" class="primary" disabled>저장</button></div>
</aside></main>
<script type="module">
import { pipeline, env, RawImage } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";
env.allowLocalModels=false;
const $=s=>document.querySelector(s),c=$('#c'),ctx=c.getContext('2d',{willReadFrequently:true}),file=$('#file'),empty=$('#empty'),status=$('#status'),bar=$('#bar'),save=$('#save'),before=$('#before'),depthView=$('#depthView'),reanalyze=$('#reanalyze');
const ids=['flash','ambient','hard','depthStrength','spec','bg','temp','sat'],E=Object.fromEntries(ids.map(k=>[k,$('#'+k)]));
let src=null,depth=null,dw=0,dh=0,estimator=null,busy=false,name='flash-look',raf=0,out=null;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lum=(r,g,b)=>(.2126*r+.7152*g+.0722*b)/255;
function vals(){ids.forEach(k=>{let v=+E[k].value,t=(k==='flash'||k==='ambient')?(v/100).toFixed(2)+' EV':(k==='temp'||k==='sat')?((v>0?'+':'')+v):v+'%';$('#'+k+'V').textContent=t})}
function dAt(x,y,w,h){if(!depth)return .55;let fx=x/Math.max(1,w-1)*(dw-1),fy=y/Math.max(1,h-1)*(dh-1),x0=fx|0,y0=fy|0,x1=Math.min(dw-1,x0+1),y1=Math.min(dh-1,y0+1),tx=fx-x0,ty=fy-y0;let a=(depth[y0*dw+x0]*(1-tx)+depth[y0*dw+x1]*tx)/65535,b=(depth[y1*dw+x0]*(1-tx)+depth[y1*dw+x1]*tx)/65535;return a*(1-ty)+b*ty}
function render(){if(!src)return;let w=c.width,h=c.height,d=src.data;if(!out||out.width!==w||out.height!==h)out=ctx.createImageData(w,h);let o=out,z=o.data,p=Object.fromEntries(ids.map(k=>[k,+E[k].value])),amb=Math.pow(2,p.ambient/100),fp=Math.pow(2,p.flash/100)-1,hard=p.hard/100,ds=p.depthStrength/100,spec=p.spec/100,bgs=p.bg/100,sat=1+p.sat/100,temp=p.temp/50;
for(let y=0;y<h;y++)for(let x=0;x<w;x++){let i=(y*w+x)*4,L=lum(d[i],d[i+1],d[i+2]),D=dAt(x,y,w,h),dx=dAt(Math.min(w-1,x+2),y,w,h)-dAt(Math.max(0,x-2),y,w,h),dy=dAt(x,Math.min(h-1,y+2),w,h)-dAt(x,Math.max(0,y-2),w,h),nx=-dx*7*ds,ny=-dy*7*ds,nz=1,nn=Math.hypot(nx,ny,nz);nx/=nn;ny/=nn;nz/=nn;let sx=(x/(w-1)-.5)*.65,sy=(y/(h-1)-.5)*.65,ln=Math.hypot(sx,sy,1),lx=-sx/ln,ly=-sy/ln,lz=1/ln,face=clamp(nx*lx+ny*ly+nz*lz,.2,1),near=depth?(.42+.58*D):.72,fall=(1-ds)+ds*(.38+.62*near*near),ambient=amb*(.76+.24*Math.pow(L,.6))*(1-bgs*ds*(1-D)*.45),F=fp*(.34+.66*Math.pow(1-L,.4))*fall*(.45+.55*face);
let mult=ambient+F,r=d[i]*mult,g=d[i+1]*mult,b=d[i+2]*mult;let edge=(Math.abs(dx)+Math.abs(dy))*255*hard*ds*.8;r+=edge;g+=edge;b+=edge;let mx=Math.max(d[i],d[i+1],d[i+2])/255,mn=Math.min(d[i],d[i+1],d[i+2])/255,chroma=mx-mn,peak=clamp((L-.42)*2.1)*clamp((.28-chroma)*3.5+L*.35),sp=spec*peak*Math.pow(face,4)*(.45+.55*near),target=248;r+=Math.max(0,target-r)*sp;g+=Math.max(0,target-g)*sp;b+=Math.max(0,target-b)*sp;let gray=.2126*r+.7152*g+.0722*b;r=gray+(r-gray)*sat;g=gray+(g-gray)*sat;b=gray+(b-gray)*sat;r+=temp*12;b-=temp*12;z[i]=clamp(r,0,255);z[i+1]=clamp(g,0,255);z[i+2]=clamp(b,0,255);z[i+3]=d[i+3]}ctx.putImageData(o,0,0)}
async function analyze(im){if(busy)return;busy=true;reanalyze.disabled=true;depthView.disabled=true;try{status.textContent='Depth 모델 준비 중… 첫 실행은 다운로드 때문에 시간이 걸릴 수 있음.';bar.style.width='18%';if(!estimator)estimator=await pipeline('depth-estimation','onnx-community/depth-anything-v2-small',{dtype:'q4',device:'wasm'});bar.style.width='48%';status.textContent='사진의 depth 분석 중…';let maxSide=256,s=Math.min(1,maxSide/Math.max(im.naturalWidth,im.naturalHeight)),tw=Math.max(64,Math.round(im.naturalWidth*s)),th=Math.max(64,Math.round(im.naturalHeight*s)),tc=document.createElement('canvas');tc.width=tw;tc.height=th;tc.getContext('2d').drawImage(im,0,0,tw,th);let raw=await RawImage.fromURL(tc.toDataURL('image/jpeg',.88)),out=await estimator(raw),dep=out.predicted_depth;
if(!dep||!dep.data)throw Error('depth output unavailable');let dims=dep.dims||[];dh=dims[dims.length-2]||th;dw=dims[dims.length-1]||tw;let a=dep.data,mn=Infinity,mx=-Infinity;for(let i=0;i<a.length;i++){mn=Math.min(mn,a[i]);mx=Math.max(mx,a[i])}let rg=mx-mn||1;depth=new Uint16Array(a.length);for(let i=0;i<a.length;i++)depth[i]=Math.round((a[i]-mn)/rg*65535);dep=null;out=null;raw=null;tc.width=1;tc.height=1;tc=null;if(estimator){try{await estimator.dispose()}catch(_e){}estimator=null}bar.style.width='100%';status.textContent='Depth 완료 · 거리 + 표면 방향을 반영해 직광 계산 중.';depthView.disabled=false;render()}catch(e){console.error(e);depth=null;if(estimator){try{await estimator.dispose()}catch(_e){}estimator=null}bar.style.width='0%';status.textContent='Depth 분석 실패 · 기본 relighting으로 표시 중. 재분석 가능.';render()}finally{busy=false;reanalyze.disabled=false}}
file.onchange=e=>{let f=e.target.files[0];if(!f)return;name=f.name.replace(/\.[^.]+$/,'');let u=URL.createObjectURL(f),im=new Image;im.onload=async()=>{empty.style.display='none';save.disabled=before.disabled=reanalyze.disabled=false;await analyze(im);let w=im.naturalWidth,h=im.naturalHeight,max=800000;if(w*h>max){let sc=Math.sqrt(max/(w*h));w=Math.round(w*sc);h=Math.round(h*sc)}c.width=w;c.height=h;ctx.drawImage(im,0,0,w,h);src=ctx.getImageData(0,0,w,h);out=ctx.createImageData(w,h);render();im.src='';URL.revokeObjectURL(u)};im.src=u};
function schedule(){vals();if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render()})}ids.forEach(k=>E[k].oninput=schedule);before.onpointerdown=()=>src&&ctx.putImageData(src,0,0);['pointerup','pointercancel','pointerleave'].forEach(ev=>before.addEventListener(ev,render));depthView.onclick=()=>{if(!depth)return;let im=ctx.createImageData(c.width,c.height);for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){let v=Math.round(dAt(x,y,c.width,c.height)*255),i=(y*c.width+x)*4;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}ctx.putImageData(im,0,0);setTimeout(render,1800)};reanalyze.onclick=()=>{if(!src||busy)return;let tc=document.createElement('canvas');tc.width=c.width;tc.height=c.height;tc.getContext('2d').putImageData(src,0,0);let im=new Image;im.onload=async()=>{await analyze(im);im.src='';tc.width=1;tc.height=1;tc=null};im.src=tc.toDataURL('image/jpeg',.82)};$('#advBtn').onclick=()=>$('#adv').classList.toggle('open');save.onclick=()=>{render();c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'-flash-v4.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/jpeg',.90)};vals();
</script></body></html>
